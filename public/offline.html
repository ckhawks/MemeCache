<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline - MemeCache</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        background: #ffffff;
        color: #171717;
        text-align: center;
        padding: 0 16px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #121212;
          color: #ffffff;
        }
      }
      button {
        margin-top: 16px;
        padding: 8px 16px;
        border-radius: 6px;
        border: 1px solid currentColor;
        background: none;
        color: inherit;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>You're offline</h1>
      <p>MemeCache needs a connection to load memes.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
